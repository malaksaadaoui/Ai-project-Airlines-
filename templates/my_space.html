<!-- templates/my_space.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Space | SkyWings</title>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f9f9f9;
      padding: 40px;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .top-bar h1 {
      margin: 0;
      font-size: 28px;
    }

    .actions {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 26px;
      border-radius: 40px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }

    .btn.primary {
      background: linear-gradient(135deg,#667eea,#764ba2);
      color: white;
    }

    .btn.secondary {
      background: #eeeeee;
      color: #333;
    }

    /* ===== CARD ===== */
    .card {
      background: #fff;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    /* ===== SCROLLABLE LIST ===== */
    .scroll-list {
      max-height: 360px;
      overflow-y: auto;
      margin-top: 20px;
      padding-right: 10px;
    }

    .comment-item {
      background: #f9f9f9;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .comment-item em {
      display: block;
      margin-top: 6px;
      color: #333;
    }

    .comment-meta {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* ===== BADGES ===== */
    .badge {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .positive { background: #d4edda; color: #155724; }
    .negative { background: #f8d7da; color: #721c24; }
    .neutral  { background: #e2e3e5; color: #383d41; }

    .category {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>

<body>

  <!-- ===== TOP BAR ===== -->
  <div class="top-bar">
    <h1>Welcome, {{ current_user.nom }}</h1>

    <div class="actions">
      <a href="{{ url_for('comment') }}" class="btn secondary">← Home</a>
      <a href="{{ url_for('logout') }}" class="btn primary">Logout</a>
    </div>
  </div>

  <!-- ===== FEEDBACK HISTORY ===== -->
  <div class="card">
    <h3>✈️ My Feedback History</h3>

    <div class="scroll-list">
      {% for c in my_comments %}
        <div class="comment-item">
          <strong>Flight:</strong> {{ c.flight_id or "N/A" }}
          <em>"{{ c.text }}"</em>

          <div class="comment-meta">
            <span class="badge {{ c.sentiment }}">
              {{ c.sentiment | capitalize }}
            </span>

          </div>
        </div>
      {% else %}
        <p>No feedback submitted yet.</p>
      {% endfor %}
    </div>
  </div>

</body>
</html>
